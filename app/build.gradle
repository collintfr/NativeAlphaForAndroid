apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.mikepenz.aboutlibraries.plugin'

aboutLibraries {
    excludeFields = ["generated"]
}

//https://gist.github.com/shakalaca/6422811
android {
    packaging {
        // Compress Gecko's native libraries inside the APK (≈60% smaller download).
        jniLibs { useLegacyPackaging true }
    }

    dependenciesInfo {
        includeInApk = false
    }
    compileSdk {
        version = release(37) { minorApiLevel = 2 }
    }
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86_64"
            universalApk false
        }
    }
    flavorDimensions "default"
    productFlavors {
        extended {
            dimension "default"
            applicationIdSuffix ".pro"
            resValue "string", "app_name", "Native Alpha +"
        }
        extendedGithub {
            dimension "default"
            resValue "string", "app_name", "Native Alpha"
        }
        standard {
            dimension "default"
            isDefault true
            resValue "string", "app_name", "Native Alpha"
        }
    }

    defaultConfig {
        applicationId "com.cylonid.nativealpha"
        minSdkVersion 28
        targetSdkVersion 35
        versionCode 1520
        versionName "1.5.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }
    buildFeatures {
        dataBinding true
        buildConfig true
        resValues true
        viewBinding true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
          applicationIdSuffix = ".debug"
          resValue "string", "app_name", "_DEBUG-Native Alpha"
        }
        applicationVariants.all {
                // this method is use to rename your release apk only
            variant ->
                variant.outputs.each {
                        // on below line we are setting a name to our apk
                    output ->
                        // on below line we are specifying our app name.
                        project.ext { appName = 'NativeAlpha' }
                        // on below line we are adding the formatted date to our apk file name.
                        def formattedDate = new Date().format('yyyy-MM-dd-HH-mm-ss')
                        // on below line we are creating a new name for our apk.
                        def newName = output.outputFile.name
                        // on below line we are replacing our previous name with our app name.
                        newName = newName.replace("app-", "$project.ext.appName-")
                        // on below line we are replacing -release with our formatted date.
                        newName = newName.replace("-release", "-release-" + "v" + variant.versionName)
                        // at last we are setting our apk name to it.
                        output.outputFileName = newName

                }
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace 'com.cylonid.nativealpha'

}
repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'com.mikhaellopez:circularprogressbar:3.1.0'
    implementation 'org.jsoup:jsoup:1.14.1'
    implementation 'com.github.ihimanshurawat:Hasher:1.2'
    implementation 'androidx.navigation:navigation-fragment:2.8.9'
    implementation 'androidx.navigation:navigation-ui:2.8.9'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'io.github.medyo:android-about-page:2.0.0'
        testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.json:json:20250107'
    testImplementation 'org.mockito:mockito-core:5.17.0'
    testImplementation 'org.mockito:mockito-android:5.17.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    androidTestImplementation 'org.mockito:mockito-android:5.17.0'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-web:3.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestUtil 'androidx.test:orchestrator:1.5.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation "com.mikepenz:aboutlibraries:11.6.3"
    implementation "com.mikepenz:aboutlibraries-core:11.6.3"
    implementation 'pub.devrel:easypermissions:3.0.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation 'com.ernestoyaquello.dragdropswiperecyclerview:drag-drop-swipe-recyclerview:1.2.0'
    implementation "androidx.fragment:fragment-ktx:1.8.6"
    implementation 'org.mozilla.geckoview:geckoview:160.0.20261104181552'
    implementation 'androidx.work:work-runtime:2.10.0'
    kapt "com.android.databinding:compiler:3.1.4"
    implementation 'com.google.android.material:material:1.12.0'


}

// ---- Bundled uBlock Origin (GPLv3) -------------------------------------------------------------
// Pinned AMO release; verified by SHA-256 and packaged as an asset so it can be installed into
// GeckoView on first launch without network access. Bump version/url/sha together.
def UBO_VERSION = "1.76.0"
def UBO_URL = "https://addons.mozilla.org/firefox/downloads/file/5225273/ublock_origin-1.76.0.xpi"
def UBO_SHA256 = "6f20ff6749193599548770539103069c20948dfcd3e61c3089a67da7bfc3be39"
def uboAssetsDir = layout.buildDirectory.dir("generated/ubo-assets")

def downloadUblock = tasks.register("downloadUblockOrigin") {
    def outFile = uboAssetsDir.map { it.file("extensions/ublock_origin.xpi") }
    outputs.file(outFile)
    inputs.property("sha", UBO_SHA256)
    doLast {
        def f = outFile.get().asFile
        f.parentFile.mkdirs()
        def sha = { File file ->
            def md = java.security.MessageDigest.getInstance("SHA-256")
            file.eachByte(65536) { buf, n -> md.update(buf, 0, n) }
            md.digest().encodeHex().toString()
        }
        if (!f.exists() || sha(f) != UBO_SHA256) {
            logger.lifecycle("Downloading uBlock Origin ${UBO_VERSION}")
            new URL(UBO_URL).withInputStream { i -> f.withOutputStream { it << i } }
            if (sha(f) != UBO_SHA256) {
                f.delete()
                throw new GradleException("uBlock Origin checksum mismatch")
            }
        }
    }
}
android.sourceSets.main.assets.srcDir(uboAssetsDir.get().asFile)
preBuild.dependsOn(downloadUblock)
